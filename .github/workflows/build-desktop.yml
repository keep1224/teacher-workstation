name: 构建桌面版

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        - os: windows-latest
          builder: --win portable
        - os: macos-latest
          builder: --mac dmg
        - os: ubuntu-latest
          builder: --linux AppImage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: workstation-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install --no-fund --no-audit

      - name: 生成图标并同步 web 文件
        run: node icon.js && node sync-assets.js

      - name: 打包
        run: npx electron-builder ${{ matrix.builder }}

      - name: 收集产物
        run: |
          mkdir -p release
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/*.exe release/ 2>/dev/null || true
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cp dist/*.dmg release/ 2>/dev/null || true
          else
            cp dist/*.AppImage release/ 2>/dev/null || true
          fi
          ls -lh release/
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: teacher-workstation-${{ matrix.os }}
          path: release/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 发 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*
          generate_release_notes: true
